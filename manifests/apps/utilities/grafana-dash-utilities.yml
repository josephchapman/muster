        panel-9:
          kind: Panel
          spec:
            id: 9
            title: ''
            description: >-
              How much of the cycle's allowance will remain at the next predicted
              billing date, assuming water is consumed at the allowance's rate from
              the latest meter reading until the next bill.


              A negative value indicates the volume of higher-rate tariff consumed.


              A positive value indicates the volume of lower-rate tariff still
              available.
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: influxdb
                        version: v0
                        spec:
                          dataset: iox
                          editorMode: code
                          format: table
                          rawQuery: true
                          rawSql: "WITH constants AS (\r\n  SELECT \r\n    60.0 AS billing_period_duration_days,\r\n    33.0 AS annual_allowance_m3\r\n),\r\nbase_data AS (\r\n  SELECT \r\n    time,\r\n    water_import,\r\n    source\r\n  FROM \"utilities\"\r\n  WHERE \r\n    time >= NOW() - INTERVAL '180 days'\r\n    AND water_import IS NOT NULL\r\n    AND source IN ('bill', 'meter')\r\n),\r\nlast_bill AS (\r\n  SELECT \r\n    time AS last_bill_time,\r\n    water_import AS last_bill_value\r\n  FROM\r\n    base_data\r\n  WHERE\r\n    source = 'bill'\r\n  ORDER BY\r\n    time DESC\r\n  LIMIT\r\n    1\r\n),\r\nlast_record AS (\r\n  SELECT \r\n    water_import AS last_record_value\r\n  FROM\r\n    base_data\r\n  ORDER BY\r\n    time DESC\r\n  LIMIT\r\n    1\r\n),\r\ncalculations AS (\r\n  SELECT\r\n    b.last_bill_time,\r\n    b.last_bill_value,\r\n    r.last_record_value,\r\n    b.last_bill_time + INTERVAL '60 days' AS next_bill_time,\r\n    EXTRACT(EPOCH FROM ((b.last_bill_time + INTERVAL '60 days') - NOW())) / 86400.0 AS days_until_next_bill,\r\n    c.annual_allowance_m3 * (c.billing_period_duration_days / 365.0) AS cycle_allowance_m3,\r\n    c.annual_allowance_m3 / 365.0 AS daily_allowance_m3,\r\n    r.last_record_value - b.last_bill_value AS cycle_consumed_m3\r\n  FROM\r\n    last_bill b\r\n  CROSS JOIN\r\n    last_record r\r\n  CROSS JOIN\r\n    constants c\r\n),\r\nsurplus AS (\r\n  SELECT\r\n    *,\r\n    cycle_allowance_m3 - cycle_consumed_m3 AS cycle_remaining_m3,\r\n    ((cycle_allowance_m3 - cycle_consumed_m3) - (daily_allowance_m3 * days_until_next_bill)) * 1000.0 AS projected_surplus_liters\r\n  FROM\r\n    calculations\r\n)\r\nSELECT\r\n  last_bill_time,\r\n  last_bill_value,\r\n  last_record_value,\r\n  next_bill_time,\r\n  days_until_next_bill,\r\n  cycle_allowance_m3,\r\n  daily_allowance_m3,\r\n  cycle_consumed_m3,\r\n  cycle_remaining_m3,\r\n  projected_surplus_liters,\r\n  projected_surplus_liters AS \"Projected Surplus\"\r\nFROM\r\n  surplus;"
                          sql:
                            columns:
                              - parameters: []
                                type: function
                            groupBy:
                              - property:
                                  type: string
                                type: groupBy
                      refId: A
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: gauge
              version: 13.1.3
              spec:
                options:
                  barShape: flat
                  barWidthFactor: 0.75
                  effects:
                    barGlow: false
