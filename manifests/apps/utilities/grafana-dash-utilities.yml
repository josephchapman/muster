apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: dashboard-utilities
  namespace: observability
spec:
  # suspend: true
  suspend: false
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  template:
    apiVersion: dashboard.grafana.app/v2
    kind: Dashboard
    metadata:
      name: gswhfl
      labels: {}
      annotations: {}
    spec:
      annotations:
        - kind: AnnotationQuery
          spec:
            query:
              kind: DataQuery
              group: grafana
              version: v0
              spec: {}
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            name: Annotations & Alerts
            builtIn: true
      cursorSync: 'Off'
      editable: true
      elements:
        panel-1:
          kind: Panel
          spec:
            id: 1
            title: ''
            description: ''
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: influxdb
                        version: v0
                        spec:
                          dataset: iox
                          editorMode: code
                          format: table
                          rawQuery: true
                          rawSql: "WITH deltas AS (\r\n  SELECT\r\n    time,\r\n    electricity_generation - LAG(electricity_generation) OVER (ORDER BY time) AS val_diff,\r\n    EXTRACT(EPOCH FROM (time - LAG(time) OVER (ORDER BY time))) AS sec_diff\r\n  FROM\r\n    utilities\r\n  WHERE\r\n    source = 'bill'\r\n    AND electricity_generation IS NOT NULL\r\n    AND time <= $__timeTo()\r\n)\r\nSELECT\r\n  time,\r\n  val_diff / (sec_diff / 86400.0) AS \"Bill\"\r\nFROM\r\n  deltas\r\nWHERE\r\n  val_diff IS NOT NULL\r\n  AND sec_diff > 0\r\nORDER BY\r\n  time ASC"
                          sql:
                            columns:
                              - parameters: []
                                type: function
                            groupBy:
                              - property:
                                  type: string
                                type: groupBy
                      refId: A
                      hidden: false
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: influxdb
                        version: v0
                        spec:
                          dataset: iox
                          editorMode: code
                          format: table
                          rawQuery: true
                          rawSql: "WITH deltas AS (\r\n  SELECT\r\n    time,\r\n    electricity_generation - LAG(electricity_generation) OVER (ORDER BY time) AS val_diff,\r\n    EXTRACT(EPOCH FROM (time - LAG(time) OVER (ORDER BY time))) AS sec_diff\r\n  FROM\r\n    utilities\r\n  WHERE\r\n    source = 'meter'\r\n    AND electricity_generation IS NOT NULL\r\n    AND time <= $__timeTo()\r\n)\r\nSELECT\r\n  time,\r\n  val_diff / (sec_diff / 86400.0) AS \"Meter\"\r\nFROM\r\n  deltas\r\nWHERE\r\n  val_diff IS NOT NULL\r\n  AND sec_diff > 0\r\nORDER BY\r\n  time ASC"
                          sql:
                            columns:
                              - parameters: []
                                type: function
                            groupBy:
                              - property:
                                  type: string
                                type: groupBy
                      refId: B
                      hidden: false
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: influxdb
                        version: v0
                        spec:
                          dataset: iox
                          editorMode: code
                          format: table
                          rawQuery: true
                          rawSql: "WITH meter_intervals AS (\r\n  SELECT\r\n    LAG(time) OVER (ORDER BY time) AS start_time,\r\n    time AS end_time\r\n  FROM\r\n    utilities\r\n  WHERE\r\n    time <= $__timeTo()\r\n    AND \"source\" = 'meter'\r\n    AND \"electricity_generation\" IS NOT NULL\r\n),\r\ndaytime_weather AS (\r\n  SELECT\r\n    time,\r\n    cloud_cover\r\n  FROM\r\n    weather\r\n  WHERE\r\n    time <= $__timeTo()\r\n    AND \"location_alias\" = 'location_1'\r\n    AND \"is_day\" = 1.0\r\n    AND \"cloud_cover\" IS NOT NULL\r\n    AND '${showCloudCover}' = 'true'\r\n)\r\nSELECT\r\n  m.end_time AS \"time\",\r\n  AVG(w.\"cloud_cover\") AS \"Cloud Cover\"\r\nFROM\r\n  meter_intervals m\r\nINNER JOIN\r\n  daytime_weather w\r\n  ON w.time > m.start_time\r\n  AND w.time <= m.end_time\r\nWHERE\r\n  m.start_time IS NOT NULL\r\nGROUP BY\r\n  m.end_time\r\nORDER BY\r\n  m.end_time ASC\r\n"
                          sql:
                            columns:
                              - parameters: []
                                type: function
                            groupBy:
                              - property:
                                  type: string
                                type: groupBy
                      refId: C
                      hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: timeseries
              version: 13.1.3
              spec:
                options:
                  annotations:
                    clustering: -1
                    multiLane: false
                  legend:
                    calcs: []
                    displayMode: list
                    enableFacetedFilter: false
                    overflow: ellipsis
                    placement: bottom
                    showLegend: true
                  tooltip:
                    hideZeros: false
                    mode: single
                    sort: none
                fieldConfig:
                  defaults:
                    unit: kWh/day
                    min: 0
                    max: 8.76
                    thresholds:
                      mode: absolute
                      steps:
                        - value: 0
                          color: transparent
                        - value: 3.96
                          color: orange
                        - value: 5.16
                          color: yellow
                        - value: 6.36
                          color: green
                        - value: 7.56
                          color: transparent
                    color:
                      mode: palette-classic
                    custom:
                      axisBorderShow: false
                      axisCenteredZero: false
                      axisColorMode: text
                      axisLabel: ''
                      axisPlacement: auto
                      barAlignment: 0
                      barWidthFactor: 0.6
                      drawStyle: line
                      fillOpacity: 0
                      gradientMode: none
                      hideFrom:
                        legend: false
                        tooltip: false
                        viz: false
                      insertNulls: false
                      lineInterpolation: stepBefore
                      lineWidth: 1
                      pointSize: 5
                      scaleDistribution:
                        type: linear
                      showPoints: auto
                      showValues: false
                      spanNulls: false
                      stacking:
                        group: A
                        mode: none
                      thresholdsStyle:
                        mode: area
                  overrides:
                    - matcher:
                        id: byName
                        scope: series
                        options: Bill
                      properties:
                        - id: color
                          value:
                            fixedColor: text
                            mode: fixed
                        - id: custom.lineInterpolation
                          value: smooth
                    - matcher:
                        id: byName
                        scope: series
                        options: Meter
                      properties:
                        - id: color
                          value:
                            fixedColor: yellow
                            mode: fixed
                    - matcher:
                        id: byName
                        scope: series
                        options: Cloud Cover
                      properties:
                        - id: custom.axisPlacement
                          value: right
                        - id: unit
                          value: percent
                        - id: max
                          value: 200
                        - id: thresholds
                          value:
                            mode: absolute
                            steps:
                              - color: transparent
                                value: 0
