apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: dashboard-weather
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  template:
    apiVersion: dashboard.grafana.app/v2
    kind: Dashboard
    metadata:
      name: gmll2f
      labels: {}
      annotations: {}
    spec:
      annotations:
        - kind: AnnotationQuery
          spec:
            query:
              kind: DataQuery
              group: grafana
              version: v0
              spec: {}
            enable: true
            hide: true
            iconColor: rgba(0, 211, 255, 1)
            name: Annotations & Alerts
            builtIn: true
      cursorSync: 'Off'
      editable: true
      elements:
        panel-1:
          kind: Panel
          spec:
            id: 1
            title: ''
            description: ''
            links: []
            data:
              kind: QueryGroup
              spec:
                queries:
                  - kind: PanelQuery
                    spec:
                      query:
                        kind: DataQuery
                        group: ''
                        version: v0
                        spec:
                          dataset: iox
                          editorMode: code
                          format: table
                          rawQuery: true
                          rawSql: "WITH bucketed AS (\r\n  SELECT\r\n    DATE_BIN(INTERVAL '4 hours', time, TIMESTAMP '1970-01-01T00:00:00Z') AS time_bucket,\r\n    location_name,\r\n    CAST(weather_code AS BIGINT) AS code,\r\n    COUNT(*) AS freq\r\n  FROM \"weather\"\r\n  WHERE\r\n    time >= $__timeFrom - INTERVAL '48 hours'\r\n    AND time <= $__timeTo + INTERVAL '24 hours'\r\n    AND location_name ~ '${location:regex}'\r\n    AND weather_code IS NOT NULL\r\n  GROUP BY 1, 2, 3\r\n),\r\nmodes AS (\r\n  SELECT\r\n    time_bucket,\r\n    location_name,\r\n    code\r\n  FROM bucketed\r\n  QUALIFY ROW_NUMBER() OVER (\r\n    PARTITION BY time_bucket, location_name \r\n    ORDER BY freq DESC, code DESC\r\n  ) = 1\r\n),\r\ntime_grid AS (\r\n  SELECT\r\n    gs AS time_bucket,\r\n    loc.location_name\r\n  FROM generate_series(\r\n    DATE_BIN(INTERVAL '4 hours', $__timeFrom - INTERVAL '48 hours', TIMESTAMP '1970-01-01T00:00:00Z'),\r\n    DATE_BIN(INTERVAL '4 hours', $__timeTo + INTERVAL '24 hours', TIMESTAMP '1970-01-01T00:00:00Z'),\r\n    INTERVAL '4 hours'\r\n  ) AS t(gs)\r\n  CROSS JOIN (SELECT DISTINCT location_name FROM modes) AS loc\r\n),\r\nfilled AS (\r\n  SELECT\r\n    g.time_bucket AS time,\r\n    g.location_name,\r\n    LAST_VALUE(m.code IGNORE NULLS) OVER (\r\n      PARTITION BY g.location_name\r\n      ORDER BY g.time_bucket\r\n      ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\r\n    ) AS filled_code\r\n  FROM time_grid g\r\n  LEFT JOIN modes m\r\n    ON g.time_bucket = m.time_bucket\r\n    AND g.location_name = m.location_name\r\n)\r\nSELECT\r\n  time,\r\n  location_name,\r\n  CASE filled_code\r\n    WHEN 0 THEN '☀️'\r\n    WHEN 1 THEN '🌤️'\r\n    WHEN 2 THEN '🌥️'\r\n    WHEN 3 THEN '☁️'\r\n    WHEN 45 THEN '🌫️' WHEN 48 THEN '🌫️'\r\n    WHEN 51 THEN '🌦️' WHEN 53 THEN '🌦️' WHEN 55 THEN '🌦️'\r\n    WHEN 56 THEN '🥶' WHEN 57 THEN '🥶'\r\n    WHEN 61 THEN '🌧️' WHEN 63 THEN '🌧️' WHEN 65 THEN '🌧️'\r\n    WHEN 66 THEN '🧊' WHEN 67 THEN '🧊'\r\n    WHEN 71 THEN '❄️' WHEN 73 THEN '❄️' WHEN 75 THEN '❄️'\r\n    WHEN 77 THEN '🌨️'\r\n    WHEN 80 THEN '🌦️' WHEN 81 THEN '🌦️' WHEN 82 THEN '🌦️'\r\n    WHEN 85 THEN '🌨️' WHEN 86 THEN '🌨️'\r\n    WHEN 95 THEN '⛈️'\r\n    WHEN 96 THEN '🌩️' WHEN 99 THEN '🌩️'\r\n    ELSE '❓'\r\n  END AS weather\r\nFROM filled\r\nWHERE filled_code IS NOT NULL\r\nORDER BY time ASC, location_name ASC;\r\n"
                          sql:
                            columns:
                              - parameters: []
                                type: function
                            groupBy:
                              - property:
                                  type: string
                                type: groupBy
                      refId: A
                      hidden: false
                transformations:
                  - kind: Transformation
                    group: groupingToMatrix
                    spec:
                      options:
                        columnField: location_name
                        rowField: time
                        valueField: weather
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: status-history
              version: 13.1.3
