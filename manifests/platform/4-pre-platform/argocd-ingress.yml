---
# This ingress cannot be created earlier in the stack because it depends on the Cluster-Issuer from this same tier
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: muster-ca
    cert-manager.io/common-name: argocd.local
    cert-manager.io/subject-organizations: Muster
    cert-manager.io/subject-organizationalunits: Tech
spec:
  ingressClassName: traefik
  rules:
  - host: argocd.local
    http:
      paths:
      - backend:
          service:
            name: argocd-server
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - argocd.local
    secretName: argocd-server-tls