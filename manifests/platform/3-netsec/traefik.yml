---
apiVersion: helm.crossplane.io/v1beta1
kind: Release
metadata:
  name: traefik
  namespace: netsec
spec:
  providerConfigRef:
    name: provider-helm
  forProvider:
    chart:
      name: traefik
      repository: https://traefik.github.io/charts
      version: "42.2.0"
    namespace: netsec
    skipCreateNamespace: true
    values:
      ingressClass:
        enabled: true
        name: traefik
        isDefaultClass: false
      providers:
        kubernetesIngress:
          enabled: true
          ingressClass: traefik
      service:
        type: LoadBalancer
      ports:
        web:
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
